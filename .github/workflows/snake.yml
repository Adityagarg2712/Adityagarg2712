name: generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"   # refresh daily so the snake tracks new contributions
  workflow_dispatch:       # and let it be triggered by hand
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render the contribution graph as an animated snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # One SVG per colour scheme, plus a gif for places that don't animate SVG.
          outputs: |
            dist/snake-light.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif?color_snake=#f97316&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
